[project]
name = "arena-backend"
version = "0.1.0"
description = "Arena HTTP API and DolphinScheduler workflow definitions"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apache-dolphinscheduler==4.1.0",
    "arena-runtime>=0.1,<0.2",
    "bcrypt>=4.3,<5",
    "fastapi>=0.115,<1",
    "mcp>=2,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=21",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
arena-runtime = { path = "../runtime", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
