[project]
name = "arena-backend"
version = "0.1.0"
description = "Arena HTTP API and DolphinScheduler workflow definitions"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apache-dolphinscheduler==4.1.0",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
