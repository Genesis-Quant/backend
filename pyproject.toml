[project]
name = "arena-backend"
version = "0.1.0"
description = "Arena HTTP API and DolphinScheduler workflow definitions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
